{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <form method="POST">
        <label>Amount (Rs.)</label>
        <input type="number" name="amount" step="0.01" min="1" required>
        <button type="submit">{{ title }}</button>
    </form>
</div>
{% endblock %}
