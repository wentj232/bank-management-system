{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Bank Details</h2>
    <p><b>Bank:</b> {{ name }}</p>
    <p><b>Branch:</b> {{ loc }}</p>
    <p><b>IFSC:</b> {{ ifsc }}</p>

    <h3>Change Branch Location</h3>
    <form method="POST">
        <input type="text" name="loc" required>
        <button type="submit">Change</button>
    </form>
</div>
{% endblock %}
